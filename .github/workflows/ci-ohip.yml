name: CI Pipeline for OHIP Streaming Client

on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/ci-ohip.yml"
      - "src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: false
          file: ./Dockerfile
